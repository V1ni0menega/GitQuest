<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitQuest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <main  class="panel-terminal">
            <header class="terminal-header">
                <span class="button dot-red"></span>
                <span class="button dot-yellow"></span>
                <span class="button dot-green"></span>

                <span class="terminal-title">guest@gitquest — bash</span>
            </header>
            
            <ul class="terminal-output">
                <li>Bem-vindo ao GitQuest. Digite 'help' para ver os comandos disponíveis.</li>
            </ul>

            <footer class="terminal-prompt"> 
                <span class="prompt-label">guest@gitquest:~$</span>    
                <input type="text" class="prompt-input" autofocus autocomplete="off" spellcheck="false">
            </footer>
            
        </main>
        
        <section class="panel-pipeline">
            <p>pipeline</p>
        </section>
        
        <aside class="panel-missions">
            <p>missions</p>
        </aside>
    </div>
    <script src="app.js"></script>
</body>
</html>
